StylesPath = styles
MinAlertLevel = suggestion

Packages = write-good, \
  proselint, \
  ai-tells

[formats]
# Vale lints a .rs file's comments and never its code. Pairing `rs` with the
# Markdown parser reads each comment as Markdown, so text in backticks counts
# as code, a `#` line as a heading, and a fenced block as no prose at all.
rs = md

[*.md]
BasedOnStyles = write-good, ai-tells, custom

[*.rs]
BasedOnStyles = write-good, ai-tells, custom
